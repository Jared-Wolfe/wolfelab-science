<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn the Wolfe–Ryder–Pyle system one character at a time using photographs of real birds.">
  <title>Learn WRP | Interactive Phone Preview</title>
  <style>
    :root {
      --ink: #17201c;
      --muted: #64706a;
      --ivory: #f5f1e7;
      --paper: #fffdf8;
      --forest: #183e33;
      --forest-2: #245648;
      --moss: #607b5f;
      --brass: #b89045;
      --line: #d8d3c6;
      --correct: #246348;
      --correct-bg: #e8f2ea;
      --wrong: #8b3d30;
      --wrong-bg: #f8e9e4;
      --shadow: 0 18px 50px rgba(34, 48, 41, .11);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 4%, rgba(184, 144, 69, .10), transparent 28rem),
        var(--ivory);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid rgba(184, 144, 69, .7); outline-offset: 3px; }

    .masthead {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 4vw;
      color: #fff;
      background: var(--forest);
      border-bottom: 1px solid rgba(255,255,255,.13);
    }
    .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.18rem;
      letter-spacing: .02em;
    }
    .masthead nav { display: flex; flex-wrap: wrap; gap: 1.15rem; }
    .masthead a {
      color: rgba(255,255,255,.82);
      font-size: .84rem;
      font-weight: 650;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .masthead a:hover { color: #fff; }

    .course-shell {
      width: min(1240px, 94vw);
      margin: 2.25rem auto 4rem;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 2.25rem;
      align-items: start;
    }

    .course-nav {
      position: sticky;
      top: 1.25rem;
      padding: 1.15rem;
      background: rgba(255,253,248,.82);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
    }
    .course-nav .eyebrow { margin: 0 0 .9rem; }
    .step-list { list-style: none; margin: 0; padding: 0; }
    .step-list li + li { margin-top: .35rem; }
    .step-button {
      width: 100%;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: .65rem;
      align-items: center;
      padding: .7rem .65rem;
      text-align: left;
      border: 0;
      border-radius: 11px;
      background: transparent;
      cursor: pointer;
    }
    .step-button:hover:not(:disabled) { background: rgba(24,62,51,.07); }
    .step-button[aria-current="step"] { color: #fff; background: var(--forest); }
    .step-button:disabled { color: #9ca39f; cursor: not-allowed; }
    .step-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: .75rem;
      font-weight: 750;
    }
    .step-label { font-size: .88rem; font-weight: 700; }
    .step-check { font-size: .88rem; }
    .course-progress {
      height: 4px;
      margin-top: 1rem;
      overflow: hidden;
      background: #dedbd1;
      border-radius: 999px;
    }
    .course-progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--brass);
      transition: width .35s ease;
    }
    .progress-copy { margin: .55rem 0 0; color: var(--muted); font-size: .76rem; }

    main { min-width: 0; }
    .panel {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .panel-body { padding: clamp(1.35rem, 4vw, 3rem); }
    .eyebrow {
      color: var(--brass);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; line-height: 1.13; }
    h1 { margin: .55rem 0 1rem; font-size: clamp(2.25rem, 6vw, 4.8rem); max-width: 12ch; }
    h2 { margin: .4rem 0 1rem; font-size: clamp(2rem, 4vw, 3.35rem); }
    h3 { margin: 0 0 .55rem; font-size: 1.35rem; }
    p { margin: 0; }
    p + p { margin-top: .9rem; }
    .lede { max-width: 67ch; color: #34423b; font-size: clamp(1.03rem, 2vw, 1.2rem); }

    .intro-hero {
      min-height: 360px;
      display: grid;
      align-items: end;
      padding: clamp(1.6rem, 5vw, 3.5rem);
      color: #fff;
      background:
        linear-gradient(90deg, rgba(16,47,38,.96), rgba(16,47,38,.74) 62%, rgba(16,47,38,.22)),
        url("assets/tutorial-wing-hero.webp") 60% center / cover no-repeat;
    }
    .intro-hero p { max-width: 58ch; color: rgba(255,255,255,.88); font-size: 1.08rem; }
    .intro-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .prerequisite {
      padding: 1.35rem;
      background: #f0eadc;
      border-left: 4px solid var(--brass);
      border-radius: 0 14px 14px 0;
    }
    .prerequisite p { color: #4b554f; }
    .text-link { color: var(--forest-2); font-weight: 750; text-underline-offset: 3px; }
    .sequence {
      margin: 0;
      padding-left: 1.2rem;
      color: #3d4943;
    }
    .sequence li + li { margin-top: .42rem; }

    .button-row { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.5rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: .72rem 1.05rem;
      border: 1px solid var(--forest);
      border-radius: 999px;
      color: var(--forest);
      background: transparent;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--forest); }
    .btn:disabled { opacity: .36; cursor: not-allowed; }
    .btn-quiet { border-color: var(--line); }

    .lesson-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: end;
      padding-bottom: 1.35rem;
      border-bottom: 1px solid var(--line);
    }
    .code-anatomy {
      display: flex;
      gap: .52rem;
      align-items: flex-start;
      padding: .7rem .8rem .6rem;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #f8f5ed;
    }
    .code-unit { display: block; }
    .code-cell {
      width: 92px;
      height: 76px;
      display: grid;
      place-items: center;
      padding: .45rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #78817c;
      background: #fffdf8;
      font-size: .76rem;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
    }
    .code-cell.active {
      color: #fff;
      background: var(--forest);
      border: 3px solid var(--forest);
      box-shadow: 0 0 0 3px rgba(184,144,69,.42);
    }
    .code-cell.adjunct { width: 104px; }
    .code-dash {
      padding-top: .7rem;
      color: var(--forest);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .lesson-overview {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(220px, .8fr);
      gap: 2rem;
      padding-top: 2rem;
    }
    .rule-card {
      padding: 1.25rem;
      background: #edf1eb;
      border-radius: 16px;
    }
    .rule-card strong { display: block; margin-bottom: .45rem; color: var(--forest); }
    .code-key { display: grid; gap: .55rem; margin-top: 1.2rem; }
    .key-row { display: grid; grid-template-columns: 46px 1fr; gap: .75rem; align-items: start; }
    .key-code {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 9px;
      color: #fff;
      background: var(--forest);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.05rem;
      font-weight: 850;
    }
    .key-row span:last-child { color: #45514a; }

    .case-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(270px, .8fr);
      min-height: 590px;
    }
    .photo-wrap {
      position: relative;
      min-height: 480px;
      overflow: hidden;
      background: #24352e;
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .species-tag {
      position: absolute;
      left: 1rem;
      top: 1rem;
      padding: .48rem .7rem;
      color: #fff;
      background: rgba(20,35,28,.78);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 9px;
      backdrop-filter: blur(8px);
    }
    .species-tag span { display: block; font-size: .72rem; opacity: .76; }
    .enlarge {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      min-height: 40px;
      padding: .45rem .72rem;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 999px;
      color: #fff;
      background: rgba(20,35,28,.72);
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .case-content {
      display: flex;
      flex-direction: column;
      padding: clamp(1.3rem, 4vw, 2.5rem);
    }
    .case-count { color: var(--muted); font-size: .78rem; font-weight: 750; text-transform: uppercase; letter-spacing: .09em; }
    .case-content h2 { margin-top: .55rem; font-size: clamp(1.75rem, 3vw, 2.45rem); }
    .prompt-note {
      color: var(--muted);
      background: #f3f0e7;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: .8rem .9rem;
    }
    .prompt-note strong {
      display: block;
      color: var(--ink);
      font-size: .76rem;
      letter-spacing: .08em;
      margin-bottom: .25rem;
      text-transform: uppercase;
    }
    .adjunct-example-photo {
      display: block;
      margin-top: .8rem;
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      object-position: center;
      border-radius: 12px;
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: .65rem;
      margin-top: 1.4rem;
    }
    .choice {
      min-height: 76px;
      border: 1px solid #aeb6b0;
      border-radius: 13px;
      background: #fff;
      cursor: pointer;
    }
    .choice:hover:not(:disabled) { border-color: var(--forest); background: #f3f7f4; }
    .choice-code { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.65rem; font-weight: 850; }
    .choice-label { display: block; color: var(--muted); font-size: .7rem; }
    .choice.correct { color: var(--correct); border-color: var(--correct); background: var(--correct-bg); }
    .choice.wrong { color: var(--wrong); border-color: var(--wrong); background: var(--wrong-bg); }
    .choice:disabled { cursor: default; }
    .feedback {
      min-height: 82px;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 12px;
      color: var(--muted);
      background: #f5f2ea;
    }
    .feedback.correct { color: var(--correct); background: var(--correct-bg); }
    .feedback.wrong { color: var(--wrong); background: var(--wrong-bg); }
    .feedback strong { display: block; margin-bottom: .25rem; }
    .case-nav {
      display: flex;
      justify-content: space-between;
      gap: .7rem;
      margin-top: auto;
      padding-top: 1.4rem;
    }

    .adjunct-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .8rem;
      margin-top: 1.4rem;
    }
    .adjunct-card {
      padding: 1.15rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .adjunct-card code { color: var(--forest); font-size: 1.05rem; font-weight: 850; }
    .adjunct-card p { margin-top: .35rem; color: var(--muted); font-size: .92rem; }

    .completion {
      padding: clamp(2rem, 6vw, 4rem);
      text-align: center;
    }
    .completion h2 { max-width: 15ch; margin-left: auto; margin-right: auto; }
    .completion p { max-width: 62ch; margin-left: auto; margin-right: auto; color: var(--muted); }
    .completion .code-anatomy { justify-content: center; margin-top: 1.25rem; }

    dialog {
      width: min(1100px, 94vw);
      max-height: 92vh;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 18px;
      background: #111a16;
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }
    dialog::backdrop { background: rgba(8,13,11,.84); }
    dialog img { width: 100%; max-height: 82vh; display: block; object-fit: contain; }
    .dialog-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .8rem 1rem;
      color: #fff;
    }
    .dialog-close { border: 0; color: #fff; background: transparent; font-size: 1.5rem; cursor: pointer; }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
      .course-shell { grid-template-columns: 1fr; margin-top: 1.25rem; }
      .course-nav { position: static; overflow-x: auto; }
      .step-list { display: flex; min-width: 650px; }
      .step-list li { flex: 1; }
      .step-list li + li { margin: 0; }
      .step-button { grid-template-columns: 28px 1fr; }
      .step-check { display: none; }
      .intro-grid, .lesson-overview, .case-layout { grid-template-columns: 1fr; }
      .case-layout { min-height: 0; }
      .photo-wrap { min-height: min(66vw, 480px); }
      .case-nav { margin-top: 1.4rem; }
    }
    @media (max-width: 640px) {
      .masthead { align-items: flex-start; padding-top: 1rem; padding-bottom: 1rem; }
      .masthead nav { justify-content: flex-end; gap: .65rem; }
      .masthead nav a:nth-child(-n+2) { display: none; }
      .course-shell { width: min(100% - 1rem, 1240px); gap: 1rem; }
      .panel { border-radius: 17px; }
      .intro-hero { min-height: 430px; background-position: 66% center; }
      .lesson-header { grid-template-columns: 1fr; }
      .code-anatomy { margin-top: .45rem; gap: .3rem; padding: .55rem; }
      .code-cell { width: 62px; height: 60px; padding: .28rem; font-size: .6rem; }
      .code-cell.adjunct { width: 68px; }
      .adjunct-grid { grid-template-columns: 1fr; }
      .choices { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wordmark">WRP Field Guide</div>
    <nav aria-label="WRP navigation">
      <a href="/wrp/">About WRP</a>
      <a href="/wrp/tutorial/" aria-current="page">Tutorial</a>
      <a href="/wrp/practice/">Practice</a>
      <a href="/wrp/resources/">Resources</a>
      <a href="/">Wolfe Lab ↗</a>
    </nav>
  </header>

  <div class="course-shell">
    <aside class="course-nav" aria-label="Tutorial progress">
      <p class="eyebrow">Your path</p>
      <ol class="step-list" id="step-list"></ol>
      <div class="course-progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <p class="progress-copy" id="progress-copy">Orientation</p>
    </aside>

    <main id="tutorial-main"></main>
  </div>

  <dialog id="photo-dialog" aria-labelledby="dialog-caption">
    <div class="dialog-bar">
      <span id="dialog-caption"></span>
      <button class="dialog-close" type="button" aria-label="Close enlarged photograph">×</button>
    </div>
    <img id="dialog-image" src="" alt="">
  </dialog>

  <script>
    const lessons = [
      {
        id: "middle",
        nav: "Middle code",
        number: "01",
        eyebrow: "Character two",
        title: "Start in the middle.",
        anatomy: "middle",
        description: "The middle character records whether the bird is actively molting. It is the fastest WRP decision and the best place to begin.",
        rule: "Use P only for a predictable, normally seasonal molt in the bird’s regular molt sequence. Adventitious replacement after accidental feather loss is still C. If you are uncertain, use C as the conservative base code.",
        keys: [
          ["P", "Pre — the bird is actively undergoing a named molt, such as the prebasic or preformative molt."],
          ["C", "Cycle — the bird is not actively molting; it is between named molts."]
        ],
        cases: [
          {
            image: "assets/yellow-rumped-warbler-active-molt.webp",
            common: "Yellow-rumped Warbler",
            scientific: "Setophaga coronata",
            question: "Which middle character belongs here?",
            note: "Captured in September in Northern California. Inspection showed symmetrical flight-feather molt on both wings, including actively growing primaries.",
            options: [["C", "Cycle"], ["P", "Pre"]],
            answer: "P",
            correct: "P is for pre. This bird is actively replacing its wing feathers in a symmetrical sequence.",
            wrong: "Look again at the gaps and growing flight feathers. This bird is actively molting, so the middle character cannot be C."
          },
          {
            image: "assets/yellow-rumped-warbler-cycle.webp",
            common: "Yellow-rumped Warbler",
            scientific: "Setophaga coronata",
            question: "What is the middle character for this bird?",
            note: "Captured in September in Northern California. Inspection showed no actively growing flight feathers and no symmetrical replacement on either wing.",
            options: [["C", "Cycle"], ["P", "Pre"]],
            answer: "C",
            correct: "C is for cycle. The flight feathers are fully grown and no active molt is visible.",
            wrong: "The wing is continuous and the feathers are fully grown. Without active molt, the middle character is not P."
          }
        ]
      },
      {
        id: "plumage",
        nav: "Plumage code",
        number: "02",
        eyebrow: "Character three",
        title: "Name the plumage.",
        anatomy: "plumage",
        description: "The third character identifies the plumage the bird currently holds—or the plumage it is acquiring when active molt is underway.",
        rule: "Ask: what plumage is present, or what plumage is this molt producing?",
        keys: [
          ["J", "Juvenile plumage"], ["F", "Formative plumage"], ["B", "Basic plumage"],
          ["A", "Alternate plumage"], ["U", "Plumage unknown"]
        ],
        cases: [
          {
            image: "assets/gray-catbird-juvenile.webp",
            common: "Gray Catbird",
            scientific: "Dumetella carolinensis",
            question: "Which plumage character fits this wing?",
            note: "Captured in June in Louisiana. The skull was unossified, and the plumage was uniformly juvenile.",
            options: [["J", "Juvenile"], ["F", "Formative"], ["B", "Basic"], ["A", "Alternate"], ["U", "Unknown"]],
            answer: "J",
            correct: "J is juvenile. The wing is uniformly fresh and lacks the contrast expected after a partial preformative molt.",
            wrong: "This is a uniformly fresh juvenile wing with no molt limit. Reconsider which plumage precedes the preformative molt."
          },
          {
            image: "assets/gray-catbird-formative.webp",
            common: "Gray Catbird",
            scientific: "Dumetella carolinensis",
            question: "Which plumage character fits this bird?",
            note: "Captured in Louisiana. Replaced wing coverts contrasted with retained juvenile feathers, creating a visible molt limit.",
            options: [["J", "Juvenile"], ["F", "Formative"], ["B", "Basic"], ["A", "Alternate"], ["U", "Unknown"]],
            answer: "F",
            correct: "F is formative. The contrast among the greater coverts reveals a partial preformative molt and retained juvenile feathers.",
            wrong: "The wing contains two feather generations. That molt limit is the key evidence for formative plumage."
          }
        ]
      },
      {
        id: "cycle",
        nav: "Cycle code",
        number: "03",
        eyebrow: "Character one",
        title: "Place the bird in its molt cycle.",
        anatomy: "cycle",
        description: "The first character records the molt cycle. A cycle begins with a prebasic molt and ends when the next prebasic molt begins. Definitive applies to a bird in basic or alternate plumage that has left its first cycle when the exact later cycle cannot be determined.",
        rule: "Juvenile and formative plumages always occur within the first molt cycle. A definitive bird is at least second cycle, but D does not mean that it is exactly second cycle.",
        keys: [
          ["F", "First cycle"], ["S", "Second cycle, when it can be identified"],
          ["D", "Definitive: basic or alternate plumage beyond the first cycle when the exact later cycle cannot be separated"], ["U", "Cycle unknown"]
        ],
        cases: [
          {
            image: "assets/carolina-wren-juvenile.webp",
            common: "Carolina Wren",
            scientific: "Thryothorus ludovicianus",
            question: "Which cycle character fits this bird?",
            note: "Captured in June in Louisiana. The skull was unossified, and the wing showed diffuse, widely spaced barring on retained juvenile feathers.",
            options: [["F", "First"], ["S", "Second"], ["D", "Definitive"], ["U", "Unknown"]],
            answer: "F",
            correct: "F is first cycle. Juvenile plumage—and any later formative plumage—belongs to the first molt cycle.",
            wrong: "The visible juvenile feather characters place this bird in its first molt cycle."
          },
          {
            image: "assets/carolina-wren-definitive.webp",
            common: "Carolina Wren",
            scientific: "Thryothorus ludovicianus",
            question: "Which cycle character fits this bird?",
            note: "Captured in Louisiana. Inspection showed dense, uniform barring across the wing, with no retained juvenile feather generation visible.",
            options: [["F", "First"], ["S", "Second"], ["D", "Definitive"], ["U", "Unknown"]],
            answer: "D",
            correct: "D is definitive. This bird has left its first cycle and is at least second cycle, but the available evidence cannot distinguish its exact later cycle.",
            wrong: "This bird has left its first cycle, but the photograph does not distinguish second from a later cycle. Use D when only definitive status is supported."
          }
        ]
      },
      {
        id: "adjunct",
        nav: "Adjunct code",
        number: "04",
        eyebrow: "Optional field",
        title: "Add detail only when it is supported.",
        anatomy: "adjunct",
        description: "The current WRP framework can place an optional adjunct before the core three-character code. The core code remains unchanged; the adjunct preserves supported cohort information or minimum age.",
        rule: "Most birds need only a core WRP code. An adjunct is added when it carries real information.",
        keys: [],
        cases: [
          {
            image: "assets/northern-cardinal-adjunct.png",
            common: "Northern Cardinal",
            scientific: "Cardinalis cardinalis",
            question: "Which complete WRP code records the minimum age supported by this bird?",
            note: "Captured in November in Louisiana. The skull was fully ossified, and no molt limits were discernible. Northern Cardinals can undergo a complete preformative molt.",
            options: [["FCF", "First-cycle formative"], ["DCB", "Definitive-cycle basic"], ["M-FCF", "Minimum first-cycle formative"], ["U-FCF", "Unresolved cohort"]],
            answer: "M-FCF",
            correct: "M-FCF is the minimum supported age. The bird may be first-cycle formative or definitive basic, so the M adjunct preserves what is known without forcing an unsupported cycle.",
            wrong: "A complete preformative molt removed the juvenile feather evidence needed to separate FCF from DCB. Choose the code that records the youngest category the evidence supports."
          }
        ]
      }
    ];

    const stepItems = [
      { id: "orientation", nav: "Before you begin", number: "00" },
      ...lessons,
      { id: "complete", nav: "Complete", number: "✓" }
    ];

    const state = {
      screen: "orientation",
      mode: "overview",
      caseIndex: 0,
      completed: new Set(),
      maxUnlocked: 0,
      answers: {}
    };

    const main = document.getElementById("tutorial-main");
    const stepList = document.getElementById("step-list");
    const progressBar = document.getElementById("progress-bar");
    const progressCopy = document.getElementById("progress-copy");
    const dialog = document.getElementById("photo-dialog");
    const dialogImage = document.getElementById("dialog-image");
    const dialogCaption = document.getElementById("dialog-caption");

    function lessonIndex(id) { return lessons.findIndex(lesson => lesson.id === id); }

    function anatomy(active) {
      return `
        <div class="code-anatomy" aria-label="WRP code anatomy">
          <span class="code-unit"><span class="code-cell adjunct ${active === "adjunct" ? "active" : ""}">Adjunct code</span></span>
          <span class="code-dash" aria-hidden="true">–</span>
          <span class="code-unit"><span class="code-cell ${active === "cycle" ? "active" : ""}">Cycle code</span></span>
          <span class="code-unit"><span class="code-cell ${active === "middle" ? "active" : ""}">Middle code</span></span>
          <span class="code-unit"><span class="code-cell ${active === "plumage" ? "active" : ""}">Plumage code</span></span>
        </div>`;
    }

    function renderNav() {
      const currentIndex = stepItems.findIndex(item => item.id === state.screen);
      stepList.innerHTML = stepItems.map((item, index) => {
        const unlocked = index <= state.maxUnlocked;
        const done = item.id === "orientation"
          ? state.maxUnlocked > 0
          : state.completed.has(item.id);
        return `<li><button class="step-button" type="button" data-step="${item.id}"
          ${unlocked ? "" : "disabled"} ${item.id === state.screen ? 'aria-current="step"' : ""}>
          <span class="step-number">${item.number}</span>
          <span class="step-label">${item.nav}</span>
          <span class="step-check" aria-hidden="true">${done ? "✓" : ""}</span>
        </button></li>`;
      }).join("");
      const percent = Math.max(0, Math.round((Math.max(currentIndex, state.maxUnlocked - 1) / (stepItems.length - 1)) * 100));
      progressBar.style.width = `${percent}%`;
      progressCopy.textContent = state.screen === "orientation" ? "Orientation" : `${percent}% of tutorial path opened`;
      stepList.querySelectorAll("[data-step]").forEach(button => {
        button.addEventListener("click", () => goTo(button.dataset.step));
      });
    }

    function goTo(id) {
      const targetIndex = stepItems.findIndex(item => item.id === id);
      if (targetIndex < 0 || targetIndex > state.maxUnlocked) return;
      state.screen = id;
      state.mode = "overview";
      state.caseIndex = 0;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderOrientation() {
      main.innerHTML = `
        <article class="panel">
          <div class="intro-hero">
            <div>
              <p class="eyebrow">Guided tutorial</p>
              <h1>Learn WRP one character at a time.</h1>
              <p>Begin with the middle character, practice with real birds, and then add plumage, cycle, and the current adjunct field.</p>
            </div>
          </div>
          <div class="panel-body">
            <div class="intro-grid">
              <div>
                <h3>How this tutorial works</h3>
                <ol class="sequence">
                  <li>Read a short explanation of one part of the code.</li>
                  <li>Assign that character to two photographs from the WRP teaching seminar.</li>
                  <li>Use the feedback to understand the visible evidence.</li>
                  <li>Move forward when both examples are correct—or return to any completed lesson.</li>
                </ol>
              </div>
              <aside class="prerequisite">
                <h3>Before you begin</h3>
                <p>WRP assumes familiarity with the <strong>Howell-modified Humphrey–Parkes nomenclature</strong>, including named molts, plumages, molt cycles, and the principal molt strategies.</p>
                <p>If those ideas are new, begin with Dani Kaschube’s IBP webinar, <a class="text-link" href="https://www.youtube.com/watch?v=5Cx7s1ssN-M" target="_blank" rel="noopener">Basics of Passerine Molt: Theory and Examples ↗</a>.</p>
              </aside>
            </div>
            <div class="button-row">
              <button class="btn btn-primary" id="begin-course" type="button">Begin with the middle code →</button>
              <a class="btn btn-quiet" href="/wrp/">Return to WRP home</a>
            </div>
          </div>
        </article>`;
      document.getElementById("begin-course").addEventListener("click", () => {
        state.maxUnlocked = Math.max(state.maxUnlocked, 1);
        goTo("middle");
      });
    }

    function renderOverview(lesson) {
      main.innerHTML = `
        <article class="panel">
          <div class="panel-body">
            <header class="lesson-header">
              <div>
                <p class="eyebrow">${lesson.eyebrow}</p>
                <h2>${lesson.title}</h2>
              </div>
              ${anatomy(lesson.anatomy)}
            </header>
            <div class="lesson-overview">
              <div>
                <p class="lede">${lesson.description}</p>
                ${lesson.id === "adjunct" ? adjunctCards() : `<div class="code-key">${lesson.keys.map(([code, text]) => `<div class="key-row"><span class="key-code">${code}</span><span>${text}</span></div>`).join("")}</div>`}
              </div>
              <aside class="rule-card">
                <strong>Keep this rule in view</strong>
                <p>${lesson.rule}</p>
              </aside>
            </div>
            <div class="button-row">
              <button class="btn btn-quiet" id="overview-back" type="button">← Back</button>
              <button class="btn btn-primary" id="overview-next" type="button">${lesson.id === "adjunct" ? "Try the Northern Cardinal →" : "Try the photographs →"}</button>
            </div>
          </div>
        </article>`;
      document.getElementById("overview-back").addEventListener("click", previousScreen);
      document.getElementById("overview-next").addEventListener("click", () => {
        state.mode = "case";
        state.caseIndex = 0;
        render();
      });
    }

    function adjunctCards() {
      return `<div class="adjunct-grid">
        <div class="adjunct-card"><code>H-FCF</code><p>Formative-plumaged bird assigned to the hatching-season cohort.</p></div>
        <div class="adjunct-card"><code>A-FCF</code><p>Formative-plumaged bird assigned to the after-hatching-season or yearling cohort.</p></div>
        <div class="adjunct-card"><code>U-FCF</code><p>Formative plumage is known, but the cohort distinction is unresolved.</p></div>
        <div class="adjunct-card"><code>M-FCF</code><p>Minimum first-cycle formative: FCF is the youngest supported category, but definitive basic cannot be excluded.</p></div>
      </div>
      <div class="rule-card" style="margin-top:1rem">
        <strong>Common field example: Northern Cardinal</strong>
        <p>Northern Cardinals undergo a complete preformative molt. Once all juvenile feathers have been replaced, a bird with formative-like plumage may be either first-cycle formative or definitive basic. When no other criterion resolves the cycle, record the minimum supported category as <strong>M-FCF</strong>. This is a common use of the M adjunct among species with complete preformative molts.</p>
        <img class="adjunct-example-photo" src="${lessons.find(lesson => lesson.id === "adjunct").cases[0].image}" alt="Open wing of a Northern Cardinal used to demonstrate the M-FCF adjunct code">
      </div>
      <p style="margin-top:1rem;color:var(--muted)">The adjunct is written before the core code and should be stored as a separate field in a database. The current framework replaces older “after” constructions with the <strong>M-</strong> minimum-age adjunct.</p>`;
    }

    function renderCase(lesson) {
      const item = lesson.cases[state.caseIndex];
      const key = `${lesson.id}-${state.caseIndex}`;
      const selected = state.answers[key];
      const correct = selected === item.answer;
      main.innerHTML = `
        <article class="panel case-layout">
          <div class="photo-wrap">
            <img id="case-photo" src="${item.image}" alt="Open wing of a ${item.common} used for a WRP coding exercise">
            <div class="species-tag"><strong>${item.common}</strong><span><em>${item.scientific}</em></span></div>
            <button class="enlarge" id="enlarge-photo" type="button">Enlarge photograph</button>
          </div>
          <div class="case-content">
            <p class="case-count">${lesson.nav} · photograph ${state.caseIndex + 1} of ${lesson.cases.length}</p>
            <h2>${item.question}</h2>
            <p class="prompt-note"><strong>Capture notes</strong>${item.note}</p>
            <div class="choices" role="group" aria-label="Choose the ${lesson.nav.toLowerCase()}">
              ${item.options.map(([value, label]) => `<button class="choice ${selected === value ? (value === item.answer ? "correct" : "wrong") : ""}" type="button" data-answer="${value}" ${correct ? "disabled" : ""}><span class="choice-code">${value}</span><span class="choice-label">${label}</span></button>`).join("")}
            </div>
            <div class="feedback ${selected ? (correct ? "correct" : "wrong") : ""}" aria-live="polite">
              ${!selected ? "Choose a character. You can inspect the photograph at full size before answering." : correct ? `<strong>That’s right.</strong>${item.correct}` : `<strong>Not quite.</strong>${item.wrong}`}
            </div>
            <div class="case-nav">
              <button class="btn btn-quiet" id="case-back" type="button">← Back</button>
              <button class="btn btn-primary" id="case-next" type="button" ${correct ? "" : "disabled"}>${state.caseIndex + 1 < lesson.cases.length ? "Next photograph →" : "Continue →"}</button>
            </div>
          </div>
        </article>`;

      document.querySelectorAll("[data-answer]").forEach(button => {
        button.addEventListener("click", () => {
          state.answers[key] = button.dataset.answer;
          render();
        });
      });
      document.getElementById("case-back").addEventListener("click", () => {
        if (state.caseIndex > 0) state.caseIndex -= 1;
        else state.mode = "overview";
        render();
      });
      document.getElementById("case-next").addEventListener("click", () => {
        if (!correct) return;
        if (state.caseIndex + 1 < lesson.cases.length) {
          state.caseIndex += 1;
          render();
        } else {
          completeLesson(lesson);
        }
      });
      document.getElementById("enlarge-photo").addEventListener("click", () => openPhoto(item));
      document.getElementById("case-photo").addEventListener("dblclick", () => openPhoto(item));
    }

    function completeLesson(lesson) {
      state.completed.add(lesson.id);
      const current = lessonIndex(lesson.id);
      const next = current + 1 < lessons.length ? lessons[current + 1].id : "complete";
      state.maxUnlocked = Math.max(state.maxUnlocked, stepItems.findIndex(item => item.id === next));
      state.screen = next;
      state.mode = "overview";
      state.caseIndex = 0;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function previousScreen() {
      const index = stepItems.findIndex(item => item.id === state.screen);
      if (index > 0) goTo(stepItems[index - 1].id);
    }

    function renderComplete() {
      main.innerHTML = `
        <article class="panel completion">
          <p class="eyebrow">Tutorial complete</p>
          <h2>You can now read the anatomy of a WRP code.</h2>
          ${anatomy("none")}
          <p style="margin-top:1.2rem">You learned the characters in the order middle → plumage → cycle → adjunct. A complete code is written adjunct–cycle–molt status–plumage.</p>
          <div class="button-row" style="justify-content:center">
            <button class="btn btn-primary" id="restart" type="button">Review from the beginning</button>
            <a class="btn btn-quiet" href="/wrp/">Return to WRP home</a>
          </div>
        </article>`;
      document.getElementById("restart").addEventListener("click", () => goTo("orientation"));
    }

    function openPhoto(item) {
      dialogImage.src = item.image;
      dialogImage.alt = `Enlarged open-wing photograph of a ${item.common}`;
      dialogCaption.innerHTML = `${item.common} · <em>${item.scientific}</em>`;
      dialog.showModal();
    }

    dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });

    function render() {
      renderNav();
      if (state.screen === "orientation") renderOrientation();
      else if (state.screen === "complete") renderComplete();
      else {
        const lesson = lessons.find(item => item.id === state.screen);
        if (state.mode === "case") renderCase(lesson);
        else renderOverview(lesson);
      }
    }

    render();
  </script>
</body>
</html>
