  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(()=&gt;{const root=document.getElementById(&quot;wrp-practice-app&quot;);const cases=[{&quot;background&quot;:&quot;MOLTS &amp; PLUMAGE: Male Yellow-rumped Warblers undergo a partial preformative molt followed by a substantial partial first prealternate molt. During the preformative molt, young birds replace their body plumage, median coverts, and usually most or all greater coverts, while retaining the juvenile primaries, primary coverts, secondaries, and generally the tail. The resulting FCF male can already look fairly adult-like, but the narrow, brownish, minimally edged juvenile primary coverts and brown flight feathers reveal its first-cycle status. During winter and early spring, the first prealternate molt replaces much of the head and body plumage and usually several to most greater coverts, producing the bright male breeding phenotype while leaving the juvenile remiges and primary coverts intact. Consequently, an FCA/SY male may contain three feather generations in a single wing—new alternate greater coverts, retained formative greater coverts, and juvenal primary coverts/remiges—which can make Yellow-rumped Warbler an exceptionally clear demonstration of sequential preformative and prealternate molts. Bright spring plumage alone is therefore a poor indicator of age: the decisive characters are the retained brown juvenile primary coverts, primaries, and secondaries. These juvenile feathers are finally replaced during the complete second prebasic molt after the first breeding season, after which the bird enters definitive basic plumage.&quot;,&quot;code&quot;:&quot;DCA&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRrqnAABXRUJQVlA4IK6nAADQwQOdASqEAxICPpFAm0qlo6wuJZNsMcASCWdtBeslhNlTA3iXZHBr4l8UEt1A9BPNf7t2ovBo6x69/QG8FXmTz1P+b6NzbFzKOnVn9CUo8k/Rn/Odb6CwlMJHlpxFjzpcimvUP3h55PmX+P4M/nPW7fvekP3f/W81v6v23v+Txl/Yf9H0FP1r/Vf/r/e+4fG79YUF/x3/F82H8/0D+23sCeY3/i8lL8b/vP2t+Az+o/6D9pfeV8F37Z6kHl5+0Ymt12KCwKI7eP1c5u/hzCtOnPpAzYyk7+WXbb8cwZqid2i9om7+FKyeem6O1  The best age character is the wing: narrow, brownish juvenile primary coverts with little edging, along with brown juvenile primaries and secondaries, contrast with darker formative greater coverts. Occasionally one or more outer juvenile greater coverts remain, creating a particularly obvious molt limit.&quot;],[&quot;FPA → FCA&quot;,&quot;Dec/Jan–May&quot;,&quot;Partial first prealternate molt → First alternate plumage&quot;,&quot;A substantial spring molt involving head and body feathers plus usually a few to most greater coverts. In males it produces the bright breeding appearance: stronger gray/black patterning, blackish auriculars, conspicuous yellow crown and flank patches, and brighter contrasting wing bars. Importantly, it normally leaves the juvenile primaries, primary coverts, and secondaries untouched.&quot;],[&quot;FCA male&quot;,&quot;Spring–summer&quot;,&quot;First alternate plumage&quot;,&quot;This can be a very bright male that superficially looks adult. Look past body coloration to the wing: retained brown, narrow juvenile primary coverts and brown flight feathers identify the first-cycle bird. Often there are three generations in the wing: alternate inner GCs, formative outer GCs, and juvenile PCs/remiges.&quot;],[&quot;SPB → DCB&quot;,&quot;Jul–Sep after first breeding season&quot;,&quot;Complete second prebasic molt → Definitive basic plumage&quot;,&quot;The remaining juvenile primaries, primary coverts, secondaries, and rectrices are replaced along with the body plumage. The resulting wing is uniformly adult-quality, with broader, darker primary coverts showing distinct gray/bluish edging.&quot;],[&quot;DPA → DCA&quot;,&quot;Dec/Jan–May annually&quot;,&quot;Partial definitive prealternate molt&quot;,&quot;Adults also undergo substantial prealternate replacement of head/body feathers and usually some to all greater coverts. Because all underlying basic flight feathers are adult-quality, an DCA male lacks the conspicuous brown juvenile PC/remige block of an FCA male.&quot;],[&quot;DPB → DCB&quot;,&quot;Jul–Sep annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Complete annual replacement; the basic → alternate cycle then repeats.&quot;]],&quot;tips&quot;:&quot;TIPS FOR THIS BIRD:  This warbler has two generations of ‘adult’ or ‘ definitive’ feathers. The definitive alternate plumage includes several inner greater coverts which tend to be looser in texture with more pronounced coloration. As a beginning bander it is imperative that you are familiar with molt strategies of captured birds so that different generations of feathers in adult birds are not confused with molt limits in formative-plumaged individuals.  Note the lustrous , thick-nature of the primary coverts coupled with the broad gray edging indicative of adult basic plumage.&quot;},{&quot;species&quot;:&quot;Yellow-rumped Warbler&quot;,&quot;sex&quot;:&quot;Male&quot;,&quot;code&quot;:&quot;FCA&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRi6qAQBXRUJQVlA4ICKqAQAQigSdASqEAw4CPok2k0elIyGlMxqcuKARCWVqMcH4Q4eZZ8aXOQrnr668qYF4MTGULIanjlDpS7AuRpwBzTOjMwfVmv/sxOb+VP8+pzjj+SZr/3ngY9LX+r9Kr0qepnnw/Sp/m/UA/pfUx/5H/weyX523rLf4r/4ezX+7/qAf//25P4B//+lv8z8hXzzrT/PPtn+d/jP9T7yP7Hij9+/xP/p/wPUX72f8fXH/af+3/VeM/65/I/+T/NewX7t+//4Fftv/B/rP914RfC/63/u/6X/Ze4X7wfd/+T/j/y2+M/8r/4f7j1Z/h/93/4/9T+WP2Bf27/P/9z2S/83heeqfuH8A/9c/zP/g/yX+m/cj6hf87/9/8L0SfsX+0/+/+z+BL+lf4v9mPzi+ev//f+74d/vZ////P8SH7zf///1L2cbU0gJaLMc/9rQ7Hps7rQPQ7VkQQgOvax9v9Az5qYMGDBgwYIyE7RyFHfXqSZVoWXMbP6yH3c81byQj9LogAasviwY1Ajc0Namsu/9UjsHlJ2Af1dblf3iNPTGlmHzsPbNvUmwNhueQ6kCitI1nUpIc7Pa7F7gUN6NK4/WbLfcAqu74UNHNJgqRdyIkNpzz/CCeKB8uMH7LY4g3qNCDwJyOc9ofkxsR16jsjjhNXB7ken2Pfe9wklayb2m4qioKkINKwfgfoHfMKLKcuIN7ukcCV7Opwsmc+XY6X3ZUhXFSybU33BA3kAzuGwW51kO5Jl9U/5eViVwwj8xVYPvJV05uV3Xx1dnxgqJHrNHsvFPb4PY2C+VcRYGR8fB0FBUSmmcGcDB+rTx7yQZZzeyGYBQHLnvdyeWLAKtlxtiIwgKu7s//pZVvLLryqvwejcL/jDOk/P3Ombz4zLvvZk772eGh6eJf7639e2GBla5mnxiXTO5NQj7soENJwuCzUHxXxTpBlk6/J/M3MF83zQyu8kkgfo0Q1johHbShdvVE 1GXqHFIxStXfzpUAV5IQ1n54cM8emSgtTyzoeao8Mky449lmztV1hWk4bsd/9+TbMdD10Cyu+Sa+TCC/OJJyWjwUpxy/03OHpWdZbbjI3WgIBw5f81xViQfIdBAJyR9cNtNKae1wROeLADWFFMW6rkV5DqxRGTq+USCccVXdeoXBQ35GrmejDK6VDIGDzKUB8TtQs6wLKUQY/HaypXJhIxwUsg1hkfF3dYc6a/vfktEA4RINi9uINHF7Yn2UqrkumOmQAfycUonD2dQrpw5dd2HYTz+0l3SEYdswR36lPPy2YbAEWH234WDnUoXkZ+RalWTvBBYVvheDYoAIElSZS8jFQ2jtaQNJxYw2Vvy+pUibJELNipOQ67Lwe4HOpYuXLqAa18nmg8g/g9WQiqvdB9tZuLVMNLwpjvB+iuXDHnIpoukRb1DoMQtUUAUMgJuuagyCkL3h9hX7RY+pijevY9E4AAAA&quot;,&quot;tips&quot;:&quot;TIPS FOR THIS BIRD:  This is a good example of a molt limit between the alula covert (A1) and the lesser alula (A2). Remember, the greater alula (A3) is not typically used to infer age. Note the primary coverts are also worn, contrasting with the greater coverts. Also, this individual may have adventitiously replaced an inner primary covert&quot;,&quot;background&quot;:&quot;MOLTS &amp; PLUMAGE: Male Yellow-rumped Warblers undergo a partial preformative molt followed by a substantial partial first prealternate molt. During the preformative molt, young birds replace their body plumage, median coverts, and usually most or all greater coverts, while retaining the juvenile primaries, primary coverts, secondaries, and generally the tail. The resulting FCF male can already look fairly adult-like, but the narrow, brownish, minimally edged juvenile primary coverts and brown flight feathers reveal its first-cycle status. During winter and early spring, the first prealternate molt replaces much of the head and body plumage and usually several to most greater coverts, producing the bright male breeding phenotype while leaving the juvenile remiges and primary coverts intact. Consequently, an FCA/SY male may contain three feather generations in a single wing—new alternate greater coverts, retained formative greater coverts, and juvenal primary coverts/remiges—which can make Yellow-rumped Warbler an exceptionally clear demonstration of sequential preformative and prealternate molts. Bright spring plumage alone is therefore a poor indicator of age: the decisive characters are the retained brown juvenile primary coverts, primaries, and secondaries. These juvenile feathers are finally replaced during the complete second prebasic molt after the first breeding season, after which the bird enters definitive basic plumage.&quot;,&quot;table&quot;:[[&quot;Stage&quot;,&quot;Approx. timing&quot;,&quot;Molt / plumage&quot;,&quot;What to look for in males&quot;],[&quot;FPJ → FCJ&quot;,&quot;Spring–summer&quot;,&quot;Prejuvenile molt → Juvenile plumage&quot;,&quot;Juveniles are relatively loose-textured and brownish-gray, with subdued body patterning. The entire wing and tail are juvenile at this point.&quot;],[&quot;FPF → FCF&quot;,&quot;Mostly Jun–Sep&quot;,&quot;Partial preformative molt → Formative plumage&quot;,&quot;Replaces essentially the body plumage, median coverts, and most to all greater coverts, sometimes including the greater alula. Primaries, primary coverts, secondaries, and generally the rectrices remain juvenile. Most young birds replace all greater coverts, so absence of an obvious within-GC molt limit does not make a bird adult.&quot;],[&quot;FCF male&quot;,&quot;Fall–winter&quot;,&quot;Formative plumage&quot;,&quot;Young males become fairly adult-like but remain browner overall. The best age character is the wing: narrow, brownish juvenile primary coverts with little edging, along with brown juvenile primaries and secondaries, contrast with darker formative greater coverts. Occasionally one or more outer juvenile greater coverts remain, creating a particularly obvious molt limit.&quot;],[&quot;FPA → FCA&quot;,&quot;Dec/Jan–May&quot;,&quot;Partial first prealternate molt → First alternate plumage&quot;,&quot;A substantial spring molt involving head and body feathers plus usually a few to most greater coverts. In males it produces the bright breeding appearance: stronger gray/black patterning, blackish auriculars, conspicuous yellow crown and flank patches, and brighter contrasting wing bars. Importantly, it normally leaves the juvenile primaries, primary coverts, and secondaries untouched.&quot;],[&quot;FCA male&quot;,&quot;Spring–summer&quot;,&quot;First alternate plumage&quot;,&quot;This can be a very bright male that superficially looks adult. Look past body coloration to the wing: retained brown, narrow juvenile primary coverts and brown flight feathers identify the first-cycle bird. Often there are three generations in the wing: alternate inner GCs, formative outer GCs, and juvenile PCs/remiges.&quot;],[&quot;SPB → DCB&quot;,&quot;Jul–Sep after first breeding season&quot;,&quot;Complete second prebasic molt → Definitive basic plumage&quot;,&quot;The remaining juvenile primaries, primary coverts, secondaries, and rectrices are replaced along with the body plumage. The resulting wing is uniformly adult-quality, with broader, darker primary coverts showing distinct gray/bluish edging.&quot;],[&quot;DPA → DCA&quot;,&quot;Dec/Jan–May annually&quot;,&quot;Partial definitive prealternate molt&quot;,&quot;Adults also undergo substantial prealternate replacement of head/body feathers and usually some to all greater coverts. Because all underlying basic flight feathers are adult-quality, an DCA male lacks the conspicuous brown juvenile PC/remige block of an FCA male.&quot;],[&quot;DPB → DCB&quot;,&quot;Jul–Sep annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Complete annual replacement; the basic → alternate cycle then repeats.&quot;]]},{&quot;species&quot;:&quot;Black-headed Grosbeak&quot;,&quot;sex&quot;:&quot;Male&quot;,&quot;code&quot;:&quot;DCA&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRhYaAQBXRUJQVlA4IAoaAQBwMQWdASqEA1MCPpE+mUmloyWqqLSdIVASCWduIq/uCvIlVci8xdoPyvJgbwBsjis+YaLtSapV0O0d4VnAHmBZ06/9L69+rNan1o17dK/Py6Xu281P/80dfObvh3h++a/03fn+f+9j/Ne07/UZS/f/Bb+vfxj/h64P93xB/WP8f0KfiPCM854j+aviX/IeoL/cPQv/2+P9+j/7fsE/1H/X/th7x3/T5af2//oewn5eH//95n72///3kf3Z//56QTTPTvwEM G0QAAAA&quot;,&quot;tips&quot;:&quot;TIPS FOR THIS BIRD: Note no contrast in the lustrous-black primary coverts and greater coverts The extent and/or existence of the presupplemental and/or prealternate molt is Black-headed Grosbeak is currently in question.&quot;,&quot;background&quot;:&quot;MOLTS &amp; PLUMAGE: Male Black-headed Grosbeaks have a partial, often protracted preformative molt followed by a variable partial first prealternate molt, producing one of the more striking examples of delayed plumage maturation in North American passerines. During the preformative molt, young males replace the body plumage and much of the wing-coverts, often along with tertials and rectrices, while retaining their brown juvenal primaries, primary coverts, and most secondaries; these retained flight feathers create conspicuous molt limits and are among the best characters for recognizing first-cycle birds. During winter and early spring, the first prealternate molt replaces portions of the head and body and sometimes additional coverts, producing black head feathering and richer orange underparts. Its extent varies dramatically, so an FCA male can range from almost female-like to nearly indistinguishable in body plumage from an older male. Regardless of how bright the bird becomes, however, the retained brown juvenile primaries and primary coverts reveal its first-cycle status. The remaining juvenile flight feathers are normally lost during the second prebasic molt after the first breeding season, when the male acquires a uniformly adult-quality wing and definitive basic plumage.&quot;,&quot;table&quot;:[[&quot;Stage&quot;,&quot;Approx. timing&quot;,&quot;Molt / plumage&quot;,&quot;What to look for in males&quot;],[&quot;FPJ → FCJ&quot;,&quot;Nestling–summer&quot;,&quot;Prejuvenile molt → Juvenile plumage&quot;,&quot;Young males are initially much more female-like: brownish head and upperparts, buffy/orange underparts, and brown wings and tail.&quot;],[&quot;FPF → FCF&quot;,&quot;Late summer–fall, often extending into migration/nonbreeding period&quot;,&quot;Partial preformative molt → Formative plumage&quot;,&quot;Replaces body plumage and many/all lesser, median, and greater coverts; tertials and rectrices may also be replaced. Primaries, primary coverts, and most secondaries remain juvenile. Consequently, dark formative coverts contrast sharply with browner juvenile flight feathers. Pheucticus, including Black-headed Grosbeak, does not normally replace primaries during the preformative molt.&quot;],[&quot;FCF&quot;,&quot;Fall–winter&quot;,&quot;Formative male plumage&quot;,&quot;Young males remain relatively subdued and often female-like. The wing is especially diagnostic: dark newly grown coverts overlying brown juvenile primaries, primary coverts, and secondaries. Some of this molt can be geographically displaced; Black-headed Grosbeaks are well documented moving to the North American monsoon region before completing their fall molt.&quot;],[&quot;FPA → FCA&quot;,&quot;Winter–early spring&quot;,&quot;Partial first prealternate molt → First alternate plumage&quot;,&quot;The important second transformation. Typically renews portions of the head, upper back, breast/body plumage and sometimes inner wing coverts. Males acquire black on the head/face and richer orange underparts, but extent is extraordinarily variable. Some FCA males remain quite female-like, whereas others approach definitive males. The juvenile primaries and primary coverts remain brown and worn.&quot;],[&quot;FCA / SY breeding male&quot;,&quot;Spring–summer&quot;,&quot;First alternate plumage&quot;,&quot;This is classic delayed plumage maturation. The bird may have a black-and-orange adult-like head/body while retaining an obviously immature brown wing. Degree of adult-male-like coloration varies enormously among individuals, and historical work found that variation in yearling male appearance largely reflects variation in the extent of the first prealternate molt.&quot;],[&quot;SPB → DCB&quot;,&quot;Late summer–fall after first breeding season&quot;,&quot;Second prebasic molt, normally complete → Definitive basic plumage&quot;,&quot;The juvenile primaries, primary coverts, and secondaries are finally replaced. The wing becomes uniformly dark and adult-quality. Much of this molt occurs after movement to the monsoon region of the Southwest/northwestern Mexico rather than directly on the breeding grounds.&quot;],[&quot;DPA → DCA&quot;,&quot;Winter–spring&quot;,&quot;Partial definitive prealternate molt&quot;,&quot;Adults again renew portions of the head/body and some coverts, producing the definitive alternate appearance: black head and back, rich orange-cinnamon underparts, and strongly black-and-white wings.&quot;],[&quot;DPB → DCB&quot;,&quot;Late summer–fall annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Complete annual renewal, generally associated with molt migration into the North American monsoon region.&quot;]]},{&quot;species&quot;:&quot;Black-headed Grosbeak&quot;,&quot;sex&quot;:&quot;Male&quot;,&quot;code&quot;:&quot;FCA&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRuYwAQBXRUJQVlA4INowAQBw0QSdASqEA34CPpE+mUkloyIoq9W7cRASCWduRbFuCvd/g89EGP/oejh6xz057HyfvEzkkDn44HF/9sfIjguUdfNAqGGvO3ri2i3knjw6O2hbj5/gZw/K1vS+dw84iB5vNd87/we+X9K9Kf20L0fyfgd/ZP31oW7Sf4H/K9A7JPtGuy8xTCT/g84P5L1BPLf/qeIv+M/4/7mfAT/WP9L60v/P//vOp+9f9L0s//z/uPbo//3/h/+fyt/dn///9b4gv3D////hPC4v2u4M1LVRJny56gMWPcJGHk5XEWUcNY/2EezoT10ViJpSnOTzEO5mjVMPRTaMkhhHW8OcnTslsZZg0EXfbenw+23zzVuzXqf2OB+RDau04//F9GJ8Snzu0n5yVdIwrVr27lJh413rOhEl1wEsP2j+3vJoTQFy6Bh+eeD4tnMamNQRRX53JReNEzSj3YSxRg4hwL2SVbUlxyifGefErdjtAsEn0fAZIq9Ex97mNS6Rx6R+uKHWZGdPRrpTDLcIt/aoHw0DYRSgBeq4hIxgtlcAfcCqYOlyy8LcBsmoWdVxUuOPA4eV1O6gg6VxgKRnIOdTJ9HL7HBlmGopZfhl7NYu4i9bQZP3pmbXqaDGFLdU0UlMiTD6MOfi6hCJgUXWi/8g1cc6eDw/kh3E7aXR5gB6lH/nNRjqBpH36mdlkfQnVFgm1kqE+70LLhplvQ+q7l9OqrhSsICrFj0+CknMeE3rQkUOZFxJeikpr/Qnqmg/yDRQuEBpWQY5befzZx4Ud2jNaY3CEvOVOnZPOHAoXRntDEWL0IbT9yE8RW , primary coverts, and most secondaries; these retained flight feathers create conspicuous molt limits and are among the best characters for recognizing first-cycle birds. During winter and early spring, the first prealternate molt replaces portions of the head and body and sometimes additional coverts, producing black head feathering and richer orange underparts. Its extent varies dramatically, so an FCA male can range from almost female-like to nearly indistinguishable in body plumage from an older male. Regardless of how bright the bird becomes, however, the retained brown juvenile primaries and primary coverts reveal its first-cycle status. The remaining juvenile flight feathers are normally lost during the second prebasic molt after the first breeding season, when the male acquires a uniformly adult-quality wing and definitive basic plumage.&quot;,&quot;table&quot;:[[&quot;Stage&quot;,&quot;Approx. timing&quot;,&quot;Molt / plumage&quot;,&quot;What to look for in males&quot;],[&quot;FPJ → FCJ&quot;,&quot;Nestling–summer&quot;,&quot;Prejuvenile molt → Juvenile plumage&quot;,&quot;Young males are initially much more female-like: brownish head and upperparts, buffy/orange underparts, and brown wings and tail.&quot;],[&quot;FPF → FCF&quot;,&quot;Late summer–fall, often extending into migration/nonbreeding period&quot;,&quot;Partial preformative molt → Formative plumage&quot;,&quot;Replaces body plumage and many/all lesser, median, and greater coverts; tertials and rectrices may also be replaced. Primaries, primary coverts, and most secondaries remain juvenile. Consequently, dark formative coverts contrast sharply with browner juvenile flight feathers. Pheucticus, including Black-headed Grosbeak, does not normally replace primaries during the preformative molt.&quot;],[&quot;FCF&quot;,&quot;Fall–winter&quot;,&quot;Formative male plumage&quot;,&quot;Young males remain relatively subdued and often female-like. The wing is especially diagnostic: dark newly grown coverts overlying brown juvenile primaries, primary coverts, and secondaries. Some of this molt can be geographically displaced; Black-headed Grosbeaks are well documented moving to the North American monsoon region before completing their fall molt.&quot;],[&quot;FPA → FCA&quot;,&quot;Winter–early spring&quot;,&quot;Partial first prealternate molt → First alternate plumage&quot;,&quot;The important second transformation. Typically renews portions of the head, upper back, breast/body plumage and sometimes inner wing coverts. Males acquire black on the head/face and richer orange underparts, but extent is extraordinarily variable. Some FCA males remain quite female-like, whereas others approach definitive males. The juvenile primaries and primary coverts remain brown and worn.&quot;],[&quot;FCA / SY breeding male&quot;,&quot;Spring–summer&quot;,&quot;First alternate plumage&quot;,&quot;This is classic delayed plumage maturation. The bird may have a black-and-orange adult-like head/body while retaining an obviously immature brown wing. Degree of adult-male-like coloration varies enormously among individuals, and historical work found that variation in yearling male appearance largely reflects variation in the extent of the first prealternate molt.&quot;],[&quot;SPB → DCB&quot;,&quot;Late summer–fall after first breeding season&quot;,&quot;Second prebasic molt, normally complete → Definitive basic plumage&quot;,&quot;The juvenile primaries, primary coverts, and secondaries are finally replaced. The wing becomes uniformly dark and adult-quality. Much of this molt occurs after movement to the monsoon region of the Southwest/northwestern Mexico rather than directly on the breeding grounds.&quot;],[&quot;DPA → DCA&quot;,&quot;Winter–spring&quot;,&quot;Partial definitive prealternate molt&quot;,&quot;Adults again renew portions of the head/body and some coverts, producing the definitive alternate appearance: black head and back, rich orange-cinnamon underparts, and strongly black-and-white wings.&quot;],[&quot;DPB → DCB&quot;,&quot;Late summer–fall annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Complete annual renewal, generally associated with molt migration into the North American monsoon region.&quot;]]},{&quot;species&quot;:&quot;Northern Flicker&quot;,&quot;sex&quot;:&quot;Male&quot;,&quot;code&quot;:&quot;SCB&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRrinAABXRUJQVlA4IKynAACQEQSdASqEA58CPpFCnEmlo6KqpjKL8VASCWNu9Is/qMzjgP9fPgxzs1y9X/x8Un9xu2GljITovFbenORmjiUU/zSeP/O9+nzo7k88Hqjzweob+oeor/SPTV6l//F6O/9x6Kf/o9fv9I9Tj+j9WJ6Unm8etj+72SVTDPK/7vwj/Mve6nC1cf/3/k+2j/q8m/2D/V81r/b+qXJj+CzLf+X0BqI3zb/p6avL9/mdFL/7fvd6+f3T/0/vjxSyy4O945PBu9udwnna/7RNB7+CUVdeOO1KcDcOr+2CNaEdpkZoL93dCZxgbWCMcUwqVmuC2b2qc0DDSomI+yNxqPmq/dPYTDBjzLCiuYmg9GrPC52M217lUrRHGA4QQ4GVNxQ/NpTXHGkr/3JiXIRJsyPyJNmR+dQ39mqEVJyQPJq3pPtQxQzNN1n9GH5ZzqkRYUFe+VIG+N4oBPU+7mT44mdlSPsoUMNEcuSoAAExWg2WlyZnuVuOVfObsjznZ6MgJ9oCpScFeOc5lyChNhPpcQBWI7vNZ0dwK1QQ1wbsWtHb5UW3E8V94PbLsw9l4IzYmnstKJQdqnfUzqa+G60Z7C1UlkY8AWaTtfj/d3FCVcR+c2NREqcRJKV0erHEUKonrPbyW+O2YMBh0jBwL5G9ij93jkQXXZAnWdfG/xxT86l0UyR96Uz3nbqSegnSA/jwlGOAjAGRLnGvzdLJ4lKpRgcEJWNGb9yYREouSSqm+7aiYPVB7syhdgDIiMMm9E8rEvx7E6tcYLz17N5dugyq2nLLhIsnME27a0G/XF/AQt6pE5+stiDllMvbqiCIjCGY1RPjquF0F2uoYfioL1K0ONI22/N2O8DzfAeDVldsYKT2Af5Nw9jXoseQeU/ydX6/ymNbuHoiZ4fM/DGbNSkXWt9ZQ1U07nTfAmwNLPH5rwnTaNMkV0s07WaFNarZsiCCfGaaiy/W43E5fGuHMxFI2LJSyTyvqLJSKQgFkTqM53+Fjjg+FCqlRdw7pzBvRenItud5nL/NSPJuUSNh3blrj3WOfr4S5123TDsf9BmrDeMbsNEhvyVbJg/IDl9FzmJ5IOHTiLPiV1TzBl/5eItGCQU/0NeUfuiue/GbvtYcQ6AVVCcw0r7cXaWgji8BTqx+9Een7mgbi4mu8MD5POFk4LDIBYsSLGymKCK7o87Hi3mKZ3kuFpO6p6C2/kJf64NiJwHkSiuLi5u3ULWS2Mf82KeY8e0a6RaIhxBrduPW79VFwvlnRkJKkfLU1FKViPNkJmQq2HtaKEIC6sHH7pyXHZs8yHg/626f/LV+Eza2BF+eodREevJIgl8ZX3cLaVHGwNgD0lEqOEjnCglk8lg3lhjCxMQCD1IJg3MZEtf0eD3v3anCGHbJDuFkuh6uu1WOfdpiQ6Mwj8ggVo88dAtn/zqMSkQm+gxhrI8eiU7XWzpCMKO9eXCCDVAjCTG1Gl1HXejZXLnKoZDK7cufhUQNeNZgHmMYJH2tsjgvmtcqmZ3rffq2CBiSEBJsLwig2O420kryG7dtpahGUY2HJkiY2lCjP4bU kers have an unusual formative strategy in which the preformative molt is extensive in the flight feathers but incomplete overall: young birds replace the body plumage, all primaries, and normally the rectrices, yet retain essentially all juvenal primary coverts and most secondaries. Consequently, an FCF flicker can have a largely fresh, adult-looking wing while still carrying a conspicuous block of uniformly faded juvenile primary coverts and, usually, juvenile secondaries. There is no meaningful first prealternate molt, so birds breed for the first time in formative plumage rather than acquiring a distinct FCA plumage. During the following second prebasic molt, in the primary coverts, only the outer few primary coverts are typically replaced, and some juvenile secondaries may also persist. The resulting bird enters SCB, and by the following breeding season is a SCB individual, recognizable by fresh dark outer primary coverts contrasting sharply with old pale inner juvenile coverts and sometimes retained juvenile secondaries. Thus Northern Flickers may retain juvenile feathers for more than two calendar years, making them a particularly good example of why WRP cycle/plumage terminology can convey information that simple HY/SY/ASY ages cannot.&quot;,&quot;table&quot;:[[&quot;Stage&quot;,&quot;Approx. timing&quot;,&quot;Molt / plumage&quot;,&quot;What to look for&quot;],[&quot;FPJ → FCJ&quot;,&quot;Nestling–early summer&quot;,&quot;Prejuvenile molt → Juvenile plumage&quot;,&quot;Juvenile plumage is softer and looser than adult plumage, with broader dark barring and generally duller patterning. Juvenal p10 is relatively large and broad, providing a useful character before it is replaced.&quot;],[&quot;FPF → FCF&quot;,&quot;Begins around fledging; mostly Jun–Oct&quot;,&quot;Incomplete but very extensive preformative molt → Formative plumage&quot;,&quot;Unlike most passerines, young flickers replace all primaries during the formative molt; molt may begin with the reduced inner primaries while the bird is still near the nest and proceeds outward. Rectrices are also normally replaced. However, virtually all juvenal primary coverts are retained, as are most secondaries; only about 10% of examined Northern Flickers replaced any secondaries, generally 2–3 inner ones. Thus the wing remains strongly multigenerational despite having new primaries.&quot;],[&quot;FCF&quot;,&quot;Fall through first breeding season&quot;,&quot;Formative plumage&quot;,&quot;The most useful first-cycle signature is a set of uniformly faded/brown juvenile primary coverts contrasting with the newer wing feathers. Greater coverts can also show a formative/juvenal limit, with replaced inner coverts differing from retained outer ones. These retained juvenile feathers persist through the bird&#x27;s first breeding season.&quot;],[&quot;FPA → FCA&quot;,&quot;Winter–spring&quot;,&quot;Absent&quot;,&quot;Northern Flickers essentially do not undergo a first prealternate molt. Thus an SY breeding bird remains in FCF, rather than acquiring an FCA plumage. There is no distinct seasonal breeding plumage generated by a spring molt.&quot;],[&quot;SPB → SCB&quot;,&quot;Late summer–fall after first breeding season&quot;,&quot;Incomplete second prebasic molt → Second-cycle basic plumage&quot;,&quot;Primaries and tail are again renewed, but the primary-coverts are replaced only gradually: typically the outer 1–5 primary coverts are replaced while inner juvenile coverts remain. Some birds also retain 1–2 juvenile secondaries. Thus the bird may complete its second prebasic molt yet still retain feathers grown as a juvenile.&quot;],[&quot;SCB — the TY condition&quot;,&quot;Fall of SY year through following spring/summer, when calendar age becomes TY&quot;,&quot;Second-cycle basic plumage&quot;,&quot;This is the especially important flicker condition. A TY/SCB bird typically has fresh dark outer primary coverts contrasting sharply with pale, abraded inner juvenile primary coverts. Retained juvenile secondaries, when present, are often symmetrically retained and contrast strongly with newer feathers. Thus a bird can be in its third calendar year but only its second basic plumage, because the molt has not yet eliminated all juvenile feathers.&quot;],[&quot;TPB → TCB / DCB&quot;,&quot;Late summer–fall of TY year&quot;,&quot;Third prebasic molt&quot;,&quot;Additional old primary coverts and secondaries are replaced. Most birds approach definitive feathering, but occasional individuals can still retain unusually old feathers and therefore qualify as TCB rather than DCB. Three generations of primary coverts have even been documented in Northern Flicker.&quot;],[&quot;DPB → DCB&quot;,&quot;Annually thereafter&quot;,&quot;Definitive prebasic molt&quot;,&quot;Adults replace the primaries and most or all other flight feathers annually, although occasional definitive secondaries or primary coverts can be retained, producing subtler molt limits than those involving juvenile feathers.&quot;]]},{&quot;species&quot;:&quot;Lazuli Bunting&quot;,&quot;sex&quot;:&quot;Female&quot;,&quot;code&quot;:&quot;DCA&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRgaYAABXRUJQVlA4IPqXAAAwegSdASqEA6ACPpFEnEolo6krpTLbeXASCWdtTaGmPL/1qdh+/vntE0n0i88/wHhL/PeBT2I6ZfBMoDca3Px/7Hopz5vCtuz7T3VVvlez1+OSfn7/b/T8//pn3/3cObVYHvyT/2+eT55/pf/3/heUv6n+z/9/+H7Uf/Po3+D/7/O/+yf3X2d7qP/Tyh/rv+397vV4/4/rzTkPwU3Hk4f6fvn7Tfq//g6N+6J6LD/79Rn3sUSAWKRn8tRUnFxdLbS6RJjz+6bESOlDAmn27+F5KPL2EntfZ5qDQDHyfwRBm6wIDiOsgQ+Fm3P3+7qKdwoLtP63qzYmlvdhaYfCXuMsjy724z8imic6ISDY58gfOclAOqjDs3Jguqxq62Rwp+ZBH06teTSPjSysDJLsCOWz79i7r4Wir3DTc2KRFH+dy/9bS3P0/3X4T0VQOEXuSDSWpvEZZezPrVj+dCwcWe03WFzwngzRW59U7ESJf/jJ4EHWfFkZTfB5FFhLe33JKwWiq20oowcUOO7//rQP5jVstSaOVzjLpBFUXj6cq0VzEsB4NVMB94fblcUugi7ZlOz/8uYOnS8abVNHlL5G5zwmSc3VHbLgDKOOzP7+n9qfr07K5yDc1+V1FVzTDXhkv+ZrQ1wNatHvRXMLMr2/xUw8Kod/ZpQfnXFVxd9snWcwMxtLjvRq2Bkrc9M2DtjUSM8YbWd5gQU1TPqPehPEfmImGyNSYjYe8E+LFJirwfC7y8sgbjdSFixf9fcmy1YGS2HwgqDCrnVEWaEzLwyuHpH134KN  reveals strong contrasts between fresh formative feathers and narrow, faded juvenal feathers; these molt limits are much more useful for aging than overall female coloration, and tail shape is of little value because young birds commonly replace the rectrices. The first prealternate molt is comparatively minor, involving primarily a few feathers of the head, throat, and breast and little or none of the wing, so females enter their first breeding season largely in the plumage produced during the extensive formative molt. Their first complete replacement of the remaining juvenal feathers occurs during the second prebasic molt after their first breeding season.&quot;,&quot;table&quot;:[[&quot;Stage&quot;,&quot;Approx. timing&quot;,&quot;Molt / plumage&quot;,&quot;What to look for in females&quot;],[&quot;FPJ → FCJ&quot;,&quot;May–Aug&quot;,&quot;Prejuvenile molt → Juvenile plumage&quot;,&quot;Juveniles are relatively cinnamon-brown, with pale-edged upperparts and heavier streaking below than later plumages. Juvenile males and females can be quite similar at this stage.&quot;],[&quot;FPF → FCF&quot;,&quot;Jun–Nov, much of it during southward migration&quot;,&quot;Extensive eccentric preformative molt → Formative plumage&quot;,&quot;This is the key molt. Young birds replace essentially all greater coverts and typically the outer 4–8 primaries, inner 3–6 secondaries/tertials, often the alula, a variable number of outer primary coverts, and usually rectrices. A central block of juvenal inner primaries and outer secondaries is commonly retained. In females, the retained juvenal primary coverts can be narrow, faded, and abraded against much fresher formative greater coverts and remiges, producing excellent molt limits.&quot;],[&quot;FCF appearance&quot;,&quot;Fall–winter&quot;,&quot;Formative female plumage&quot;,&quot;Following this extensive molt, females already look broadly adult-like: grayish/buffy brown with pale wing bars and sometimes a subtle bluish wash on the rump, wings, or tail. Because much of the wing has been replaced, aging requires finding the remaining juvenile feather block, rather than simply looking for “young-looking” plumage.&quot;],[&quot;FPA → FCA&quot;,&quot;Late winter–spring&quot;,&quot;Very limited first prealternate molt → First alternate plumage&quot;,&quot;Much less extensive than in Indigo Bunting. Modern banding summaries describe replacement mainly among body feathers of the head, throat, and breast, potentially somewhat more extensive in SY birds; the classic molt study found the prealternate molt restricted largely to just a few head feathers. It generally does not substantially alter the female wing or erase the formative/juvenile molt limits.&quot;],[&quot;SPB → DCB&quot;,&quot;Aug–Oct after first breeding season&quot;,&quot;Complete second prebasic molt → Definitive basic plumage&quot;,&quot;All body and flight feathers are replaced, often after the bird has moved south to a molt stopover in the Southwest or northwestern Mexico. The remaining juvenile feathers disappear, leaving an essentially uniform adult-quality wing.&quot;],[&quot;DPA → DCA&quot;,&quot;Late winter–spring&quot;,&quot;Very limited definitive prealternate molt&quot;,&quot;Again, only a small amount of head/body feather replacement occurs. Adult females therefore show relatively little seasonal plumage transformation.&quot;],[&quot;DPB → DCB&quot;,&quot;Aug–Oct annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Complete replacement of all feathers; the annual cycle then repeats.&quot;]]},{&quot;species&quot;:&quot;Spotted Towhee&quot;,&quot;sex&quot;:&quot;Male&quot;,&quot;code&quot;:&quot;FCF&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRmxhAQBXRUJQVlA4IGBhAQAwUwWdASqEA7YCPpE+mEkloyUsq7fbOZASCWVsyzUbXXfo3BwZb0V7OZdhFhKfZvVJ7U4hGUe0F/w/EG8y/rHTR/1Hcs9z/2HsCeDvzJ/qfR8/4/od0d/9ryl/Zl3KIbVCtb6y67elZoIdTYOf9jm69Vm5T53d49vnn+V/4ffD+j+9j/P+1B/OZN/hf9bzL/sH8A0B9n/7r4h36x5bsF3yPQH3e/8Hmr/E/8f2AvKv/p+Gj+K/6f7 darker flight feathers than females.&quot;],[&quot;FPF → FCF&quot;,&quot;Mostly Jul–Oct&quot;,&quot;Partial–incomplete preformative molt → Formative plumage&quot;,&quot;Replaces essentially all body feathers, lesser and median coverts, usually all greater coverts, often 1–3 tertials, and anywhere from 0 to all 12 rectrices. Primaries, primary coverts, and most secondaries are normally retained juvenal feathers. This creates strong molt limits, especially between fresh greater coverts and retained primary coverts.&quot;],[&quot;FPA → FCA&quot;,&quot;Late winter–spring, usually absent&quot;,&quot;Absent to very limited first prealternate molt&quot;,&quot;Spotted Towhees generally do not acquire a distinct first alternate plumage. When a prealternate molt occurs, it may involve only a few feathers, sometimes just throat feathers. Most first-cycle birds therefore breed essentially in formative plumage.&quot;],[&quot;SPB → DCB&quot;,&quot;Late summer after first breeding season&quot;,&quot;Complete second prebasic molt → Definitive basic plumage&quot;,&quot;All body and flight feathers are replaced. The juvenal primaries and primary coverts disappear, leaving a single generation of uniformly adult-quality feathers.&quot;],[&quot;DPA → DCA&quot;,&quot;Winter–spring, usually absent&quot;,&quot;Absent–limited definitive prealternate molt&quot;,&quot;Again, generally no meaningful seasonal molt; occasionally a few throat feathers may be replaced. There is therefore little or no discrete “breeding plumage.”&quot;],[&quot;DPB → DCB&quot;,&quot;Late summer annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Complete annual replacement; the basic plumage is essentially the plumage carried through the subsequent breeding season.&quot;]]},{&quot;species&quot;:&quot;Western Tanager&quot;,&quot;sex&quot;:&quot;Male&quot;,&quot;code&quot;:&quot;FCA&quot;,&quot;image&quot;:&quot;data:image/webp;base64,UklGRjpQAQBXRUJQVlA4IC5QAQDQxAWdASqEA6ACPpE+mEmloyIkKvW7uLASCWVrstjaw seful for aging.&quot;,&quot;table&quot;:[[&quot;Stage&quot;,&quot;Approx. timing&quot;,&quot;Molt / plumage&quot;,&quot;What to look for&quot;],[&quot;FPJ → FCJ&quot;,&quot;Nestling → Jun–Aug&quot;,&quot;Prejuvenile molt → Juvenile plumage&quot;,&quot;Female-like, dusky, distinctly streaked below; juvenile wing/tail feathers narrow and relatively weakly pigmented.&quot;],[&quot;FPF → FCF&quot;,&quot;Jul–Sep, mostly Jul–Aug&quot;,&quot;Partial preformative molt → Formative plumage&quot;,&quot;Replaces body feathers and usually lesser/median coverts plus a variable number of inner greater coverts. Most remiges, primary coverts, and rectrices remain juvenal, creating conspicuous molt limits.&quot;],[&quot;FPA → FCA&quot;,&quot;Feb–Apr, winter grounds&quot;,&quot;Partial–incomplete first prealternate molt → First alternate plumage&quot;,&quot;Body/head renewed; variable median/greater coverts; often some tertials and sometimes rectrices. In males this produces the familiar red/orange head before northbound migration.&quot;],[&quot;SPB → DCB&quot;,&quot;Jul–Sep after first breeding season&quot;,&quot;Complete second prebasic molt → Definitive basic plumage&quot;,&quot;All body and flight feathers replaced. Adults commonly leave breeding areas first and molt farther south, particularly in the SW U.S./Mexican monsoon region.&quot;],[&quot;DPA → DCA&quot;,&quot;Feb–Apr annually&quot;,&quot;Limited–partial definitive prealternate molt → Definitive alternate plumage&quot;,&quot;Body/head feathers plus typically only a few inner greater coverts; usually no tertials or rectrices in adults. Breeding male gets brilliant red head/yellow body.&quot;],[&quot;DPB → DCB&quot;,&quot;late summer annually&quot;,&quot;Complete definitive prebasic molt&quot;,&quot;Whole plumage replaced; cycle repeats.&quot;]]}];const order=[{key:&quot;middle&quot;,idx:1,label:&quot;Middle code&quot;,q:&quot;Is this bird actively undergoing a predictable molt?&quot;,choices:[[&quot;C&quot;,&quot;Cycle — n &lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
